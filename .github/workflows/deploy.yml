name: Deploy Infraestrutura EKS

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Ação a executar'
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  deploy:
    name: Terraform ${{ github.event.inputs.acao }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        if: github.event.inputs.acao == 'apply'
        run: terraform apply -auto-approve
      - name: Terraform Destroy
        if: github.event.inputs.acao == 'destroy'
        run: terraform destroy -auto-approve

      - name: Configurar kubectl
        if: github.event.inputs.acao == 'apply'
        run: aws eks update-kubeconfig --region sa-east-1 --name oficina-cluster

      - name: Aplicar manifestos Kubernetes (exceto secret)
        if: github.event.inputs.acao == 'apply'
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Criar secret com credenciais
        if: github.event.inputs.acao == 'apply'
        run: |
          kubectl create secret generic oficina-secrets \
            --namespace=oficina \
            --from-literal=DB_HOST=${{ secrets.DB_HOST }} \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME=oficina \
            --from-literal=DB_USER=oficina \
            --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aguardar rollout
        if: github.event.inputs.acao == 'apply'
        run: kubectl rollout status deployment/oficina-app -n oficina --timeout=300s
