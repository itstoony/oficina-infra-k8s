name: Deploy Infraestrutura EKS

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Ação a executar'
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  deploy:
    name: Terraform ${{ github.event.inputs.acao }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # ── APPLY ────────────────────────────────────────────────────────────────

      - name: Terraform Apply
        if: github.event.inputs.acao == 'apply'
        run: terraform apply -auto-approve

      - name: Configurar kubectl
        if: github.event.inputs.acao == 'apply'
        run: aws eks update-kubeconfig --region sa-east-1 --name oficina-cluster

      - name: Liberar slot CoreDNS (t3.micro)
        if: github.event.inputs.acao == 'apply'
        run: kubectl scale deployment coredns --replicas=1 -n kube-system

      - name: Criar namespace oficina
        if: github.event.inputs.acao == 'apply'
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy RabbitMQ compartilhado
        if: github.event.inputs.acao == 'apply'
        run: kubectl apply -f k8s/rabbitmq.yaml

      - name: Aguardar RabbitMQ pronto
        if: github.event.inputs.acao == 'apply'
        run: kubectl rollout status deployment/rabbitmq -n oficina --timeout=180s

      # ── DESTROY ──────────────────────────────────────────────────────────────

      - name: Configurar kubectl (destroy)
        if: github.event.inputs.acao == 'destroy'
        run: aws eks update-kubeconfig --region sa-east-1 --name oficina-cluster

      - name: Remover LoadBalancers antes do destroy
        if: github.event.inputs.acao == 'destroy'
        run: |
          kubectl delete svc --all -n oficina --ignore-not-found=true
          sleep 30

      - name: Terraform Destroy
        if: github.event.inputs.acao == 'destroy'
        run: terraform destroy -auto-approve
